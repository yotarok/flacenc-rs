# The encoder relies on hardware FMA and wide integer SIMD for its LPC
# analysis and Rice parameter search. Baseline x86-64 codegen falls back to
# software float helpers and scalar SIMD emulation, which costs about 2.7x
# in throughput. The x86-64-v3 level (FMA, AVX2, BMI2) has been available on
# mainstream CPUs since 2013 and produces bit-identical output here.
[target.'cfg(target_arch = "x86_64")']
rustflags = ["-C", "target-cpu=x86-64-v3"]
